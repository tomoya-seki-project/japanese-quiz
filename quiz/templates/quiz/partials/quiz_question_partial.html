<form class="quiz-ajax-form" method="POST" action="{% url "quiz:quiz_submit_answer" %}">
    {% csrf_token %}
    <input type="hidden" name="user_vocab_id" value="{{ question_vocab.id }}">
    <input type="hidden" name="tips_count" value="0" id="tips-count">
    <input type="hidden" name="answer" id="answer-input">

    {{ question_vocab.vocab.word }}

    <div id="answer-display"></div>

    <button type="submit">Enter</button>
</form>
