<div id="quiz-count">
    {% if total_quiz_num > 0 %}
        {{ current_quiz_num }}/{{ total_quiz_num }}問
    {% else %}
        第{{ current_quiz_num }}問
    {% endif %}
</div>
<form class="quiz-ajax-form" 
    method="POST" 
    action="{% url "quiz:quiz_submit_answer" %}"
    data-correct-answer="{{ question_vocab.vocab.kana }}">
    {% csrf_token %}
    <input type="hidden" name="user_vocab_id" value="{{ question_vocab.id }}">
    <input type="hidden" name="tips_count" value="0" id="tips-count">
    <input type="hidden" name="answer" id="answer-input">

    {{ question_vocab.vocab.word }}

    <div id="answer-display"></div>
    <div>
        <button type="button" class="tips-button">Tip</button>
        <button type="submit">Enter</button>
    </div>
</form>
<form class="quiz-ajax-form" method="POST" action="{% url "quiz:quiz_skip" %}">
    {% csrf_token %}
    <button type="submit">Skip</button>
</form>
