{% extends "core/base.html" %}
{% block content %}
    <h1>ログイン</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ログイン</button>
    </form>
    <p>
        メールアドレス認証が完了していない場合は、
        認証メールを再送してください。
    </p>

    <a href="{% url 'accounts:resend_activation_email' %}">
        認証メールを再送する
    </a>
{% endblock %}
