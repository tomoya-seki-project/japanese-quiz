{% extends "core/base.html" %}
{% block page_title %}ログイン{% endblock %}
{% block content %}
    <div class="ui-stack">
        <form method="post" class="ui-stack" novalidate>
            {% csrf_token %}
            {% for field in form %}
                {% include "core/components/field.html" %}
            {% endfor %}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="ui-button ui-button-action w-full" type="submit">ログイン</button>
        </form>
        <section class="ui-card ui-stack">
            <p class="text-center">メールアドレス認証が完了していない場合は、認証メールを再送してください。</p>
            <a class="ui-button ui-button-action ui-button-secondary"
               href="{% url 'accounts:resend_activation_email' %}">認証メールを再送する</a>
        </section>
    </div>
{% endblock %}
