{% for feedback in feedbacks %}
    <article class="ui-list-item">
        <a href="{% url 'core:feedback_detail' pk=feedback.pk %}?next={{ request.get_full_path|urlencode }}">
            <div class="flex items-center gap-2 {% if feedback.status == 'pending' %}text-danger font-bold{% elif feedback.status == 'replied' %}text-success{% endif %}">
                <span class="shrink-0" aria-label="{{ feedback.get_status_display }}">
                    {% include "core/components/icon.html" with name=feedback.status %}
                </span>
                <span class="min-w-0 flex-1 truncate bg-metadata text-ink rounded-lg p-2">{{ feedback.user.username }}</span>
                <span class="bg-metadata text-ink rounded-lg p-2 text-[13px] shrink-0">{{ feedback.get_type_display }}</span>
            </div>
            <p class="truncate mt-3 border-t border-dashed border-line pt-3">{{ feedback.context }}</p>
        </a>
    </article>
{% empty %}
    <p class="ui-card text-center">該当するフィードバックはありません。</p>
{% endfor %}
