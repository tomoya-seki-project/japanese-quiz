{% extends "core/base.html" %}
{% block content %}
    <h1>フィードバック詳細</h1>
    {{ feedback.user }}
    {{ feedback.get_type_display }}
    {{ feedback.context }}
    {% if feedback.status != "closed" %}
        <a href="{% url "core:feedback_reply" feedback_pk=feedback.pk%}" class="btn btn-primary">返信</a>
    {% endif %}
{% endblock %}
