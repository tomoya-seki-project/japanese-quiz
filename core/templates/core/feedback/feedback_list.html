{% extends "core/base.html" %}
{% block content %}
<h1>Feedback</h1>
<div id="feedback-list-container">
    {% include "core/feedback/partials/feedback_list_partial.html" %}
</div>
{% endblock %}
{% block javascript %}
<script>
    document.addEventListener("DOMContentLoaded", function(){
        const feedbackListContainer = document.getElementById('feedback-list-container');
        feedbackListContainer.addEventListener('click', function(e){
            if(e.target.classList.contains('page-change')){
                e.preventDefault();
                const url = e.target.href;
                fetch(url, {
                    headers:{
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(res => res.text())
                .then(html => {
                    feedbackListContainer.innerHTML = html;
                })
                .catch(error => console.error('Error fetching filter feedback:', error));
            }
        });
    });
</script>
{% endblock %}
