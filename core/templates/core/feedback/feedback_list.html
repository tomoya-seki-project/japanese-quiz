{% extends "core/base.html" %}
{% block page_title %}フィードバック一覧{% endblock %}
{% block content %}
    <div class="list-layout">
        <form method="get" class="list-toolbar feedback-filter">
            <label for="feedback-status" class="field-label">状態</label>
            <select id="feedback-status" name="status" data-auto-submit>
                {% for value,label in filter_form.fields.status.choices %}
                    <option value="{{ value }}"
                            {% if value == selected_status %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <noscript>
                <button class="ui-button" type="submit">検索</button>
            </noscript>
        </form>
        <div class="list-scroll">{% include "core/feedback/partials/feedback_list_partial.html" %}</div>
    </div>
{% endblock %}
{% block footer %}
    {% if feedbacks %}
        <footer class="app-footer">
            {% include "core/components/pagination.html" %}
        </footer>
    {% endif %}
{% endblock %}
