{% load ui_components %}
{% for user_event in user_events %}
    <article class="ui-list-item selectable-row">
        <label class="checkbox-cell">
            <input type="hidden" name="selectable_ids" value="{{ user_event.pk }}">
            <input type="checkbox"
                   name="selected_ids"
                   value="{{ user_event.pk }}"
                   aria-label="{{ user_event.event.title }}を選択">
        </label>
        <a href="{% url 'core:user_event_detail' user_event_pk=user_event.pk %}?next={{ request.get_full_path|urlencode }}">
            <span class="badge">{{ user_event.event.event_type|event_short_label }}</span>
            <p class="border-t-2 border-dashed border-line mt-3 pt-3 line-clamp-2 {% if not user_event.is_read %}font-bold{% endif %}">{{ user_event.event.title }}</p>
        </a>
    </article>
{% empty %}
    {% include "core/event/no_unread_event.html" %}
{% endfor %}
