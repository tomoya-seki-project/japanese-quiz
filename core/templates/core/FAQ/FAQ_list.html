{% extends "core/base.html" %}
{% block content %}
<h1>FAQ list</h1>
<div id="FAQ-list-container">
    {% include "core/FAQ/partials/FAQ_list_partial.html" %}
</div>
{% endblock %}
{% block javascript %}
<script>
    document.addEventListener("DOMContentLoaded", function(){
        const FAQListContainer = document.getElementById('FAQ-list-container');
        FAQListContainer.addEventListener('click', function(e){
            if(e.target.classList.contains('page-change')){
                e.preventDefault();
                const url = e.target.href;
                fetch(url, {
                    headers:{
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(res => res.text())
                .then(html => {
                    FAQListContainer.innerHTML = html;
                })
                .catch(error => console.error('Error fetching filter FAQ:', error));
            }
        });
    });
</script>
{% endblock %}
