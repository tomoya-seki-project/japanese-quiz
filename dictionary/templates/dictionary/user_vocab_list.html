{% extends "core/base.html" %}
{% block content %}
    <h1>マイ単語帳</h1>

    <a href="{% url "dictionary:vocab_create" %}" class="btn btn-primary">単語の追加</a>
    複数の単語をまとめて追加したい場合は、フィードバックフォームで「単語の一括追加申請」を選択してください。
    <form method="GET">
        {{ search_form.as_p }}
        <button type="submit">検索</button>
    </form>
    <div id="user-vocab-list-container">
        {% include "dictionary/partials/user_vocab_list_partial.html" %}
    </div>
{% endblock %}
{% block javascript %}
    <script>
        document.addEventListener("DOMContentLoaded", function(){
            const userVocabListContainer = document.getElementById('user-vocab-list-container');
            userVocabListContainer.addEventListener('click', function(e){
                if(e.target.classList.contains('page-change')){
                    e.preventDefault();
                    const url = e.target.href;
                    fetch(url, {
                        headers:{
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    })
                    .then(res => res.text())
                    .then(html => {
                        userVocabListContainer.innerHTML = html;
                        selectorReload();
                    })
                    .catch(error => console.error('Error fetching filter user vocabs:', error));
                }
            });

            function selectorReload(){
                const selectAll = document.getElementById("select-all");
                if(!selectAll) return;
                const checkboxes = document.querySelectorAll(".in-use-checkbox");

                selectAll.addEventListener("change", function(){
                    checkboxes.forEach(function(checkbox){
                        checkbox.checked = selectAll.checked;
                    });
                });
                checkboxes.forEach(function(checkbox) {
                    checkbox.addEventListener("change", function(){
                        const allChecked = Array.from(checkboxes).every(function(box){
                            return box.checked;
                        });
                        const noneChecked = Array.from(checkboxes).every(function(box){
                            return !box.checked;
                        });

                        selectAll.checked = allChecked;
                        selectAll.indeterminate = !allChecked && !noneChecked;
                    });
                });
            }

            selectorReload();
        });
    </script>
{% endblock %}
