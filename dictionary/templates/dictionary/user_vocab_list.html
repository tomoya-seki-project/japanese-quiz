{% extends "core/base.html" %}
{% block content %}
<h1>user vocab list</h1>
<form method="GET">
    {{ search_form.as_p }}
    <button type="submit">confirm</button>
</form>
<table>
    <thead>
        <tr>
            <th>id</th>
            <th>word</th>
            <th>kana</th>
        </tr>
    </thead>
    <tbody>
        {% for vocab in vocabs %}
        <tr>
            <td>{{ vocab.vocab.pk }}</td>
            <td>{{ vocab.vocab.word }}</td>
            <td>{{ vocab.vocab.kana }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
