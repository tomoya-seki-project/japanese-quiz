{% for user_vocab in user_vocabs %}
    <article class="ui-list-item selectable-row">
        <label class="checkbox-cell">
            <input type="hidden" name="selectable_ids" value="{{ user_vocab.pk }}">
            <input class="in-use-checkbox"
                   type="checkbox"
                   name="selected_ids"
                   value="{{ user_vocab.pk }}"
                   {% if user_vocab.in_use %}checked{% endif %}
                   aria-label="{{ user_vocab.vocab.word }}を出題対象にする">
        </label>
        <a href="{% url 'dictionary:user_vocab_detail' pk=user_vocab.pk %}?next={{ request.get_full_path|urlencode }}">
            <div class="vocab-columns">
                <span>{{ user_vocab.vocab.word }}</span>
                <span>{{ user_vocab.vocab.kana }}</span>
            </div>
        </a>
    </article>
{% empty %}
    <p class="ui-card text-center">該当する単語はありません。</p>
{% endfor %}
