{% for vocab in vocabs %}
    <article class="ui-list-item">
        <a href="{% url 'dictionary:vocab_detail' pk=vocab.pk %}?next={{ request.get_full_path|urlencode }}">
            <div class="vocab-columns">
                <span>{{ vocab.word }}</span>
                <span>{{ vocab.kana }}</span>
            </div>
        </a>
    </article>
{% empty %}
    <p class="ui-card text-center">該当する単語はありません。</p>
{% endfor %}
