{% extends "core/base.html" %}
{% block content %}
    <h1>単語帳</h1>
    <form method="GET">
        {{ search_form.as_p }}
        <button type="submit">検索</button>
    </form>
    <div id="vocab-list-container">
        {% include "dictionary/partials/vocab_list_partial.html" %}
    </div>
{% endblock %}
{% block javascript %}
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            const vocabListContainer = document.getElementById('vocab-list-container')
            vocabListContainer.addEventListener('click', function(e){
                if(e.target.classList.contains('page-change')){
                    e.preventDefault();
                    const url = e.target.href;
                    fetch(url, {
                        headers:{
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    })
                    .then(res => res.text())
                    .then(html => {
                        vocabListContainer.innerHTML = html;
                    })
                    .catch(error => console.error('Error fetching filter vocabs:', error));
                }
            });
        });
    </script>
{% endblock %}
