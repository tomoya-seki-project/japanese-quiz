{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 | 言葉の輪</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    /* These essential styles also work when the shared stylesheet is unavailable. */
    body {
      margin: 0; min-width: 320px; min-height: 100dvh;
      display: grid; place-items: center; color: #26343d;
      font-family: "Zen Maru Gothic", sans-serif; background-color: #dcedf5;
    }
    .error-card {
      box-sizing: border-box; width: min(480px, calc(100% - 32px));
      margin: 24px auto; padding: 28px 20px; border-radius: 20px;
      background: #f8fcffe6; text-align: center; box-shadow: 0 4px 12px #26343d29;
    }
    .error-code { font-size: 64px; font-weight: 700; }
    .error-icon { margin: auto; }
    .error-card h1 { font-size: 28px; line-height: 1.5; font-weight: 700; margin: 16px 0; }
    .error-card p { margin: 16px 0; }
    .error-home {
      display: flex; align-items: center; justify-content: center;
      min-height: 58px; border-radius: 17px; background: #8bc9e6;
      color: #26343d; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-code">404</div>
    <svg class="error-icon" aria-hidden="true" viewBox="0 0 100 80"
         width="100" height="80" fill="none" stroke="#477a99" stroke-width="4">
      <path d="M50 5 5 75h90L50 5Zm0 0v70m0-40L30 75m20-40 20 40"/>
    </svg>
    <h1>どこどこ？<br>ページはどこ？<br>……ないよ。</h1>
    <p>いくら探してもありませんよ。URLを確認して、ホームへ戻ってください。</p>
    <a class="error-home" href="/">ホームへ</a>
  </main>
</body>
</html>
